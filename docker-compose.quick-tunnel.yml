services:
  postgres:
    image: postgres:16.14-alpine
    environment:
      POSTGRES_USER: ${KELE_DEMO_POSTGRES_USER:?KELE_DEMO_POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${KELE_DEMO_POSTGRES_PASSWORD:?KELE_DEMO_POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${KELE_DEMO_POSTGRES_DATABASE:?KELE_DEMO_POSTGRES_DATABASE is required}
    ports:
      - '127.0.0.1:${KELE_DEMO_POSTGRES_HOST_PORT:?KELE_DEMO_POSTGRES_HOST_PORT is required}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 3s
      timeout: 3s
      retries: 30
    volumes:
      - quick-tunnel-postgres:/var/lib/postgresql/data

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${KELE_DEMO_MINIO_ROOT_USER:?KELE_DEMO_MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${KELE_DEMO_MINIO_ROOT_PASSWORD:?KELE_DEMO_MINIO_ROOT_PASSWORD is required}
    ports:
      - '127.0.0.1:${KELE_DEMO_MINIO_API_HOST_PORT:?KELE_DEMO_MINIO_API_HOST_PORT is required}:9000'
      - '127.0.0.1:${KELE_DEMO_MINIO_CONSOLE_HOST_PORT:?KELE_DEMO_MINIO_CONSOLE_HOST_PORT is required}:9001'
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 3s
      timeout: 3s
      retries: 30
    volumes:
      - quick-tunnel-minio:/data

  minio-init:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${KELE_DEMO_MINIO_ROOT_USER:?KELE_DEMO_MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${KELE_DEMO_MINIO_ROOT_PASSWORD:?KELE_DEMO_MINIO_ROOT_PASSWORD is required}
      STORAGE_BUCKET: ${STORAGE_BUCKET:?STORAGE_BUCKET is required}
    entrypoint: >
      /bin/sh -c 'mc alias set demo http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" && mc mb --ignore-existing "demo/$$STORAGE_BUCKET"'

volumes:
  quick-tunnel-postgres:
  quick-tunnel-minio:
