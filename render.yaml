version: '1'

databases:
  - name: kele-m9-demo-postgres
    databaseName: kele_e2e
    user: kele_demo
    region: frankfurt
    plan: free
    postgresMajorVersion: '16'
    ipAllowList: []

services:
  - type: web
    name: kele-m9-demo-storage
    runtime: image
    image:
      url: docker.io/minio/minio@sha256:a1ea29fa28355559ef137d71fc570e508a214ec84ff8083e39bc5428980b015e
    region: frankfurt
    plan: free
    autoDeployTrigger: off
    dockerCommand: /bin/sh -c 'exec minio server /data --address ":$PORT" --console-address ":9001"'
    healthCheckPath: /minio/health/ready
    envVars:
      - key: MINIO_ROOT_USER
        value: kele-render-demo
      - key: MINIO_ROOT_PASSWORD
        generateValue: true
      - key: MINIO_BROWSER
        value: 'off'

  - type: web
    name: kele-m9-demo-api
    runtime: node
    repo: https://github.com/HeidarDorr/kele.git
    branch: feat/m09-production-hardening
    region: frankfurt
    plan: free
    autoDeployTrigger: off
    buildCommand: corepack pnpm@11.18.0 install --frozen-lockfile --prod=false && node scripts/render-demo.mjs build api
    preDeployCommand: node scripts/render-demo.mjs prepare api
    startCommand: node scripts/render-demo.mjs start api
    healthCheckPath: /api/v1/health/ready
    envVars:
      - key: KELE_DEMO_PROFILE
        value: render_free_uat
      - key: KELE_RENDER_RUNTIME
        value: render
      - key: NODE_VERSION
        value: 24.18.0
      - key: NODE_ENV
        value: development
      - key: NEXT_TELEMETRY_DISABLED
        value: '1'
      - key: DATABASE_URL
        fromDatabase:
          name: kele-m9-demo-postgres
          property: connectionString
      - key: KELE_RENDER_STOREFRONT_HOST
        fromService:
          type: web
          name: kele-m9-demo-storefront
          envVarKey: RENDER_EXTERNAL_HOSTNAME
      - key: KELE_RENDER_ADMIN_HOST
        fromService:
          type: web
          name: kele-m9-demo-admin
          envVarKey: RENDER_EXTERNAL_HOSTNAME
      - key: KELE_RENDER_STORAGE_HOST
        fromService:
          type: web
          name: kele-m9-demo-storage
          envVarKey: RENDER_EXTERNAL_HOSTNAME
      - key: KELE_RENDER_STORAGE_ACCESS_KEY
        fromService:
          type: web
          name: kele-m9-demo-storage
          envVarKey: MINIO_ROOT_USER
      - key: KELE_RENDER_STORAGE_SECRET_KEY
        fromService:
          type: web
          name: kele-m9-demo-storage
          envVarKey: MINIO_ROOT_PASSWORD
      - key: STORAGE_REGION
        value: us-east-1
      - key: STORAGE_BUCKET
        value: kele-render-demo
      - key: STORAGE_PROVIDER
        value: minio
      - key: PAYMENT_PROVIDER
        value: fake
      - key: REFUND_PROVIDER
        value: fake
      - key: SMS_PROVIDER
        value: fake
      - key: FAKE_SMS_OTP_CODE
        value: '111111'
      - key: FAKE_PAYMENT_SIGNING_SECRET
        generateValue: true
      - key: IDENTITY_SIGNING_SECRET
        generateValue: true
      - key: OTP_VERIFIER_PEPPER
        generateValue: true
      - key: ADMIN_SESSION_PROVIDER
        value: development_static
      - key: ADMIN_SUPER_SESSION_TOKEN
        generateValue: true
      - key: ADMIN_INVENTORY_SESSION_TOKEN
        generateValue: true
      - key: ADMIN_INSTAGRAM_SESSION_TOKEN
        generateValue: true
      - key: ERROR_MONITORING_PROVIDER
        value: structured_log
      - key: METRICS_BEARER_TOKEN
        generateValue: true
      - key: TRUST_PROXY_HOPS
        value: '1'

  - type: web
    name: kele-m9-demo-storefront
    runtime: node
    repo: https://github.com/HeidarDorr/kele.git
    branch: feat/m09-production-hardening
    region: frankfurt
    plan: free
    autoDeployTrigger: off
    buildCommand: corepack pnpm@11.18.0 install --frozen-lockfile --prod=false && node scripts/render-demo.mjs build storefront
    startCommand: node scripts/render-demo.mjs start storefront
    healthCheckPath: /icon.svg
    envVars:
      - key: KELE_DEMO_PROFILE
        value: render_free_uat
      - key: KELE_RENDER_RUNTIME
        value: render
      - key: NODE_VERSION
        value: 24.18.0
      - key: NODE_ENV
        value: production
      - key: NEXT_TELEMETRY_DISABLED
        value: '1'
      - key: KELE_RENDER_API_HOST
        fromService:
          type: web
          name: kele-m9-demo-api
          envVarKey: RENDER_EXTERNAL_HOSTNAME

  - type: web
    name: kele-m9-demo-admin
    runtime: node
    repo: https://github.com/HeidarDorr/kele.git
    branch: feat/m09-production-hardening
    region: frankfurt
    plan: free
    autoDeployTrigger: off
    buildCommand: corepack pnpm@11.18.0 install --frozen-lockfile --prod=false && node scripts/render-demo.mjs build admin
    startCommand: node scripts/render-demo.mjs start admin
    healthCheckPath: /icon.svg
    envVars:
      - key: KELE_DEMO_PROFILE
        value: render_free_uat
      - key: KELE_RENDER_RUNTIME
        value: render
      - key: NODE_VERSION
        value: 24.18.0
      - key: NODE_ENV
        value: production
      - key: NEXT_TELEMETRY_DISABLED
        value: '1'
      - key: KELE_RENDER_API_HOST
        fromService:
          type: web
          name: kele-m9-demo-api
          envVarKey: RENDER_EXTERNAL_HOSTNAME
      - key: KELE_RENDER_STOREFRONT_HOST
        fromService:
          type: web
          name: kele-m9-demo-storefront
          envVarKey: RENDER_EXTERNAL_HOSTNAME
      - key: ADMIN_SESSION_PROVIDER
        value: development_static
      - key: ADMIN_SUPER_SESSION_TOKEN
        fromService:
          type: web
          name: kele-m9-demo-api
          envVarKey: ADMIN_SUPER_SESSION_TOKEN
      - key: ADMIN_INVENTORY_SESSION_TOKEN
        fromService:
          type: web
          name: kele-m9-demo-api
          envVarKey: ADMIN_INVENTORY_SESSION_TOKEN
      - key: ADMIN_INSTAGRAM_SESSION_TOKEN
        fromService:
          type: web
          name: kele-m9-demo-api
          envVarKey: ADMIN_INSTAGRAM_SESSION_TOKEN
