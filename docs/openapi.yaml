        default:
          $ref: '#/components/responses/Problem'

  /admin/inventory/{skuId}:
    get:
      operationId: getAdminInventory
      tags: [Admin Inventory]
      security:
        - SessionCookie: [inventory:read]
      parameters:
        - $ref: '#/components/parameters/SkuId'
      responses:
        '200':
          description: Current inventory projection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Inventory'
        default:
          $ref: '#/components/responses/Problem'

  /admin/inventory/{skuId}/actions:
    post:
      operationId: createAdminInventoryAction
      tags: [Admin Inventory]
      security:
        - SessionCookie: [inventory:write]
      parameters:
        - $ref: '#/components/parameters/SkuId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [action, quantity, reason]
              properties:
                action:
                  type: string
                  enum:
                    - production
                    - instagram_sale
                    - manual_correction
                    - damaged_goods
                quantity:
                  type: integer
                  not:
                    const: 0
                reason:
                  type: string
                  minLength: 3
                  maxLength: 500
      responses:
        '201':
          description: Inventory movement and updated projection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Inventory'
        '409':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /admin/returns/{returnId}/approve:
    post:
      operationId: approveAdminReturn
      tags: [Admin Returns]
      security:
        - SessionCookie: [returns:decide]
      parameters:
        - $ref: '#/components/parameters/ReturnId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReturnDecisionInput'
      responses:
        '200':
          description: Return approved and downstream inventory/financial workflow applied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReturnRequest'
        '409':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /admin/returns/{returnId}/reject:
    post:
      operationId: rejectAdminReturn
      tags: [Admin Returns]
      security:
        - SessionCookie: [returns:decide]
      parameters:
        - $ref: '#/components/parameters/ReturnId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReturnDecisionInput'
      responses:
        '200':
          description: Return rejected without inventory restoration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReturnRequest'
        '409':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /admin/homepage:
    get:
      operationId: getAdminHomepage
      tags: [Admin Content]
      security:
        - SessionCookie: [content:read]
      responses:
        '200':
          description: Homepage composition.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Homepage'
        default:
          $ref: '#/components/responses/Problem'
    patch:
      operationId: updateAdminHomepage
      tags: [Admin Content]
      security:
        - SessionCookie: [content:write]
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Homepage'
      responses:
        '200':
          description: Homepage saved and publicly visible.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Homepage'
        '409':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /admin/settings/shipping:
    get:
      operationId: getAdminShippingSettings
      tags: [Admin Content]
      security:
        - SessionCookie: [settings:read]
      responses:
        '200':
          description: Effective shipping configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShippingSettings'
        default:
          $ref: '#/components/responses/Problem'
    patch:
      operationId: updateAdminShippingSettings
      tags: [Admin Content]
      security:
        - SessionCookie: [settings:write]
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShippingSettingsInput'
      responses:
        '200':
          description: New effective version of shipping settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShippingSettings'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
components:
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: kele_session
      description: Secure server-managed customer or administrator session.
    AnonymousCart:
      type: apiKey
      in: cookie
      name: kele_cart
      description: Signed high-entropy anonymous cart identifier.

  parameters:
    PageCursor:
      name: cursor
      in: query
      schema:
        type: string
        maxLength: 500
    PageSize:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 24
    Slug:
      name: slug
      in: path
      required: true
      schema:
        type: string
        pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
        maxLength: 160
    LineId:
      name: lineId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AddressId:
      name: addressId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CheckoutSessionId:
      name: checkoutSessionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PaymentAttemptId:
      name: paymentAttemptId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProductId:
      name: productId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OutfitId:
      name: outfitId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SkuId:
      name: skuId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ReturnId:
      name: returnId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 120
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Optimistic resource version.
      schema:
        type: string
        pattern: '^"[0-9]+"$'
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: Double-submit token matching the signed anti-CSRF cookie.
      schema:
        type: string
        minLength: 32
        maxLength: 256
    OptionalCsrfToken:
      name: X-CSRF-Token
      in: header
      required: false
      description: Required when an anonymous-cart cookie is presented for merge.
      schema:
        type: string
        minLength: 32
        maxLength: 256

  responses:
    Problem:
      description: RFC 9457-style problem response.
      headers:
        X-Correlation-Id:
          schema:
            type: string
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  headers:
    CorrelationId:
      description: Resolved request correlation identifier. A valid caller-supplied UUID is preserved; otherwise the API generates one.
      schema:
        type: string
        format: uuid

  schemas:
    HealthStatus:
      type: object
      additionalProperties: false
      required: [status, correlationId]
      properties:
        status:
          type: string
          const: ok
        correlationId:
          type: string
          format: uuid

    HealthUnavailable:
      type: object
      additionalProperties: false
      required: [status, correlationId]
      properties:
        status:
          type: string
          const: unavailable
        correlationId:
          type: string
          format: uuid

    PublicationStatus:
      type: string
      enum: [draft, published, archived]

    Money:
      type: object
      additionalProperties: false
      required: [amountRial, currency, display]
      properties:
        amountRial:
          type: integer
          format: int64
          minimum: 0
          description: Authoritative integer amount in Iranian rials.
        currency:
          type: string
          const: IRR
        display:
          type: string
          description: Localized display string, such as a toman presentation.

    Mobile:
      type: string
      description: Normalized Iranian mobile number in E.164 form.
      pattern: "^\\+98[0-9]{10}$"

    CategorySummary:
      type: object
      additionalProperties: false
      required: [id, slug, name, description, displayOrder]
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        description:
          type: [string, 'null']
        displayOrder:
          type: integer
          minimum: 0

    CategoryPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CategorySummary'

    CategoryDetail:
      allOf:
        - $ref: '#/components/schemas/CategorySummary'
        - type: object
          required: [products, seo]
          properties:
            products:
              $ref: '#/components/schemas/ProductCardPage'
            seo:
              $ref: '#/components/schemas/Seo'

    Media:
      type: object
      additionalProperties: false
      required: [id, url, width, height, alt, focalPoint]
      properties:
        id:
          type: string
          format: uuid
        url:
          type: string
          format: uri-reference
        width:
          type: integer
          minimum: 1
        height:
          type: integer
          minimum: 1
        alt:
          type: string
        focalPoint:
          type: object
          required: [x, y]
          properties:
            x:
              type: number
              minimum: 0
              maximum: 1
            y:
              type: number
              minimum: 0
              maximum: 1

    ProductCard:
      type: object
      additionalProperties: false
      required: [productId, slug, name, selectedVariant, availableColors, price, available]
      properties:
        productId:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        selectedVariant:
          $ref: '#/components/schemas/ColorVariantSummary'
        availableColors:
          type: array
          items:
            $ref: '#/components/schemas/ColorSwatch'
        price:
          $ref: '#/components/schemas/Money'
        available:
          type: boolean

    ProductCardPage:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ProductCard'
        page:
          $ref: '#/components/schemas/CursorPage'

    CursorPage:
      type: object
      required: [hasMore]
      properties:
        nextCursor:
          type: [string, 'null']
        hasMore:
          type: boolean

    ColorSwatch:
      type: object
      required: [variantId, name, available]
      properties:
        variantId:
          type: string
          format: uuid
        name:
          type: string
        hex:
          type: [string, 'null']
          pattern: '^#[0-9A-Fa-f]{6}$'
        available:
          type: boolean

    ColorVariantSummary:
      type: object
      required: [id, name, featuredMedia]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        featuredMedia:
          $ref: '#/components/schemas/Media'

    SkuOption:
      type: object
      required: [id, code, size, available, price]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        size:
          type: string
        available:
          type: boolean
        price:
          $ref: '#/components/schemas/Money'

    ProductDetail:
      allOf:
        - $ref: '#/components/schemas/ProductCard'
        - type: object
          required: [description, variants, categories, seo, updatedAt]
          properties:
            description:
              type: string
            details:
              type: array
              items:
                type: string
            variants:
              type: array
              items:
                type: object
                required: [id, name, gallery, skus]
                properties:
                  id:
                    type: string
                    format: uuid
                  name:
                    type: string
                  gallery:
                    type: array
                    minItems: 1
                    items:
                      $ref: '#/components/schemas/Media'
                  skus:
                    type: array
                    items:
                      $ref: '#/components/schemas/SkuOption'
            categories:
              type: array
              items:
                $ref: '#/components/schemas/CategorySummary'
            seo:
              $ref: '#/components/schemas/Seo'
            updatedAt:
              type: string
              format: date-time

    OutfitCard:
      type: object
      additionalProperties: false
      required:
        [id, revisionId, revisionNumber, slug, name, featuredMedia, startingPrice, available]
      properties:
        id:
          type: string
          format: uuid
        revisionId:
          type: string
          format: uuid
        revisionNumber:
          type: integer
          minimum: 1
        slug:
          type: string
        name:
          type: string
        featuredMedia:
          $ref: '#/components/schemas/Media'
        startingPrice:
          $ref: '#/components/schemas/Money'
        available:
          type: boolean

    OutfitCardPage:
      type: object
      required: [items, page]
