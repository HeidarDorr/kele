          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminOutfit'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /admin/outfits/{outfitId}/validation:
    get:
      operationId: validateAdminOutfit
      tags: [Admin Outfits]
