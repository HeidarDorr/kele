      summary: Archive Outfit discovery and purchase without deleting revisions.
      security:
        - SessionCookie: [catalog:publish]
      parameters:
        - $ref: '#/components/parameters/OutfitId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Outfit identity archived and history retained.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminOutfit'
        '409':
