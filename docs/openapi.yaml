      security:
        - SessionCookie: [catalog:read]
      parameters:
        - $ref: '#/components/parameters/OutfitId'
      responses:
        '200':
          description: Stable rule-ID and field-path validation result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicationValidation'
        '404':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /admin/outfits/{outfitId}/preview:
    get:
