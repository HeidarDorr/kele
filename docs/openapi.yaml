                format: uuid
              type:
                type: string
              enabled:
                type: boolean
              order:
                type: integer
                minimum: 0
              content:
                type: object
                additionalProperties: true

    Problem:
      type: object
      required: [type, title, status, code, correlationId]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
