openapi: 3.1.0
info:
  title: KELE API
  version: 0.3.0
  summary: Baseline contract for the KELE storefront and administration API.
  description: |
    This contract is the transport-level source of truth for version 1.
    Customer-facing version 1 content is Persian (fa-IR) and RTL. Monetary
    amounts are authoritative integer IRR values; display strings may use
    toman.
    Operations marked with an open-question reference are provisional and must
    not be exposed as final customer behavior until the question is resolved.
servers:
  - url: /api/v1
    description: Same-origin API
tags:
  - name: Platform
    description: Runtime liveness and dependency-readiness operations.
  - name: Catalog
  - name: Identity
  - name: Customer
  - name: Cart
  - name: Shipping
  - name: Checkout
  - name: Orders
  - name: Returns
  - name: Admin Catalog
  - name: Admin Outfits
    description: Immutable Outfit authoring, validation, publication and revision history.
  - name: Admin Inventory
    description: Authorized SKU inventory projections and auditable movements.
  - name: Admin Returns
    description: Authorized return decisions and provider-neutral refund operations.
  - name: Admin Orders
    description: Authorized fulfillment, tracking, cancellation and immutable timeline operations.
  - name: Admin Bulk Operations
    description: Persisted preview and validated apply workflows for price and inventory changes.
  - name: Admin Audit
    description: Searchable immutable business-event exploration.
  - name: Admin Content
    description: Administrative content operations.

paths:
  /health/live:
    get:
      operationId: getLiveness
      tags: [Platform]
      summary: Confirm that the API process is alive without checking dependencies.
      responses:
        '200':
          description: API process is alive.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
  /health/ready:
    get:
      operationId: getReadiness
      tags: [Platform]
      summary: Confirm that the API can serve traffic and required dependencies are available.
      responses:
        '200':
          description: API is ready to serve traffic.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
        '503':
          description: API is live but a required dependency is unavailable.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthUnavailable'
  /catalog/products:
    get:
      operationId: listCatalogProducts
      tags: [Catalog]
      security: []
      summary: List published product color variants.
      parameters:
        - $ref: '#/components/parameters/PageCursor'
        - $ref: '#/components/parameters/PageSize'
        - name: category
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
            maxLength: 120
        - name: sort
          in: query
          schema:
            type: string
            enum: [newest, price_asc, price_desc]
      responses:
        '200':
          description: Published catalog page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductCardPage'
        default:
          $ref: '#/components/responses/Problem'

  /catalog/products/{slug}:
    get:
      operationId: getCatalogProduct
      tags: [Catalog]
      security: []
      summary: Get a published product by slug.
      parameters:
        - $ref: '#/components/parameters/Slug'
        - name: color
          in: query
          description: Optional color-variant identifier to select initially.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Product detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDetail'
        '404':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /catalog/categories:
    get:
      operationId: listCatalogCategories
      tags: [Catalog]
      security: []
      summary: List published catalog categories in display order.
      responses:
        '200':
          description: Published category navigation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryPage'
        '400':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /catalog/categories/{slug}:
    get:
      operationId: getCatalogCategory
      tags: [Catalog]
      security: []
      summary: Get one published category and its published product cards.
      parameters:
        - $ref: '#/components/parameters/Slug'
        - $ref: '#/components/parameters/PageCursor'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Published category detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryDetail'
        '404':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /catalog/outfits:
    get:
      operationId: listCatalogOutfits
      tags: [Catalog]
      security: []
      summary: List published outfits.
      parameters:
        - $ref: '#/components/parameters/PageCursor'
        - $ref: '#/components/parameters/PageSize'
        - name: category
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Published outfit page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutfitCardPage'
        default:
          $ref: '#/components/responses/Problem'

  /catalog/outfits/{slug}:
    get:
      operationId: getCatalogOutfit
      tags: [Catalog]
      security: []
      parameters:
        - $ref: '#/components/parameters/Slug'
      responses:
        '200':
          description: Published outfit detail with derived availability.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutfitDetail'
        '404':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /auth/otp/challenges:
    post:
      operationId: createOtpChallenge
      tags: [Identity]
      summary: Start or rate-limit a mobile OTP challenge.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [mobile]
              properties:
                mobile:
                  $ref: '#/components/schemas/Mobile'
      responses:
        '202':
          description: Generic accepted response; does not reveal account state.
          headers:
            Set-Cookie:
              description: Rotated signed device and anti-CSRF cookies.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                required: [challengeId, retryAfterSeconds, expiresAt]
                properties:
                  challengeId:
                    type: string
                    format: uuid
                  retryAfterSeconds:
                    type: integer
                    minimum: 1
                  expiresAt:
                    type: string
                    format: date-time
        '429':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /auth/otp/verifications:
    post:
      operationId: verifyOtpChallenge
      tags: [Identity]
      summary: Verify an OTP and create/rotate a secure session.
      security: []
      parameters:
        - $ref: '#/components/parameters/OptionalCsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [challengeId, code]
              properties:
                challengeId:
                  type: string
                  format: uuid
                code:
                  type: string
                  pattern: '^[0-9]{4,8}$'
      responses:
        '200':
          description: Session created or rotated and Guest Cart merge reported.
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationResult'
        '400':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /auth/session:
    delete:
      operationId: deleteSession
      tags: [Identity]
      summary: Revoke the current session.
      security:
        - SessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: Session revoked.
        default:
          $ref: '#/components/responses/Problem'

  /me:
    get:
      operationId: getCurrentCustomer
      tags: [Customer]
      security:
        - SessionCookie: []
      responses:
        '200':
          description: Current customer profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '401':
          $ref: '#/components/responses/Problem'
    patch:
      operationId: updateCurrentCustomer
      tags: [Customer]
      security:
        - SessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                firstName:
                  type: string
                  minLength: 1
                  maxLength: 80
                lastName:
                  type: string
                  minLength: 1
                  maxLength: 80
      responses:
        '200':
          description: Updated profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        default:
          $ref: '#/components/responses/Problem'

  /me/addresses:
    get:
      operationId: listCurrentCustomerAddresses
      tags: [Customer]
      security:
        - SessionCookie: []
      responses:
        '200':
          description: Customer-owned addresses.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Address'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: createCurrentCustomerAddress
      tags: [Customer]
      security:
        - SessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddressInput'
      responses:
        '201':
          description: Address created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Address'
        default:
          $ref: '#/components/responses/Problem'

  /me/addresses/{addressId}:
    patch:
      operationId: updateCurrentCustomerAddress
      tags: [Customer]
      summary: Replace one address owned by the current customer.
      security:
        - SessionCookie: []
      parameters:
        - $ref: '#/components/parameters/AddressId'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddressInput'
      responses:
        '200':
          description: Customer-owned address updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Address'
        '404':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
    delete:
      operationId: deleteCurrentCustomerAddress
      tags: [Customer]
      summary: Delete one address owned by the current customer.
      security:
        - SessionCookie: []
      parameters:
        - $ref: '#/components/parameters/AddressId'
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: Customer-owned address deleted.
        '404':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /me/orders:
    get:
      operationId: listCurrentCustomerOrders
      tags: [Orders]
      parameters:
        - $ref: '#/components/parameters/PageCursor'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Customer-owned order summaries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderPage'
        default:
          $ref: '#/components/responses/Problem'

  /me/orders/{orderNumber}:
    get:
      operationId: getCurrentCustomerOrder
      tags: [Orders]
      parameters:
        - name: orderNumber
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 40
      responses:
        '200':
          description: Customer-owned order detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '404':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /me/returns:
    get:
      operationId: listCurrentCustomerReturns
      tags: [Returns]
      parameters:
        - $ref: '#/components/parameters/PageCursor'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Customer-owned return requests.
          content:
            application/json:
              schema:
                type: object
                required: [items, page]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ReturnRequest'
                  page:
                    $ref: '#/components/schemas/CursorPage'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: createCurrentCustomerReturn
      tags: [Returns]
      summary: Submit a return request within 24 hours after confirmed delivery.
      description: Exact key replay is side-effect free; a changed owner/Order or normalized body returns 409 `IDEMPOTENCY_KEY_REUSED`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReturnRequestInput'
      responses:
        '201':
          description: Return request submitted for administrator review.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReturnRequest'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /cart:
    get:
      operationId: getCart
      tags: [Cart]
      security:
        - SessionCookie: []
        - AnonymousCart: []
      responses:
        '200':
          description: Current cart with informational prices and availability.
          headers:
            Set-Cookie:
              description: Anonymous-cart and anti-CSRF cookies when absent or rotated.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
        default:
          $ref: '#/components/responses/Problem'
    delete:
      operationId: clearCart
      tags: [Cart]
      security:
        - SessionCookie: []
        - AnonymousCart: []
      parameters:
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: Cart cleared.
        default:
          $ref: '#/components/responses/Problem'

  /cart/lines:
    post:
      operationId: addCartLine
      tags: [Cart]
      security:
        - SessionCookie: []
        - AnonymousCart: []
      parameters:
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/ProductCartLineInput'
                - $ref: '#/components/schemas/OutfitCartLineInput'
              discriminator:
                propertyName: kind
      responses:
        '200':
          description: Updated cart. Adding a line does not reserve inventory.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
        '409':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /cart/lines/{lineId}:
    patch:
      operationId: updateCartLine
      tags: [Cart]
      security:
        - SessionCookie: []
        - AnonymousCart: []
      parameters:
        - $ref: '#/components/parameters/LineId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [quantity]
              properties:
                quantity:
                  type: integer
                  minimum: 1
                  maximum: 20
      responses:
        '200':
          description: Updated cart.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
        default:
          $ref: '#/components/responses/Problem'
    delete:
      operationId: deleteCartLine
      tags: [Cart]
      summary: Remove one line owned by the current cart.
      security:
        - SessionCookie: []
        - AnonymousCart: []
      parameters:
        - $ref: '#/components/parameters/LineId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: Line removed.
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /shipping-options:
    get:
      operationId: listShippingOptions
      tags: [Shipping]
      summary: Quote eligible configured shipping methods for a cart and address.
      security:
        - SessionCookie: []
      parameters:
        - name: cartId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: addressId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Eligible server-calculated shipping options.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ShippingOption'
        '422':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /checkout-sessions:
    post:
      operationId: createCheckoutSession
      tags: [Checkout]
      summary: Reprice, validate and atomically reserve cart components.
      security:
        - SessionCookie: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [cartId, addressId, deliveryMethod]
              properties:
                cartId:
                  type: string
                  format: uuid
                addressId:
                  type: string
                  format: uuid
                deliveryMethod:
                  $ref: '#/components/schemas/ShippingMethodCode'
      responses:
        '201':
          description: Checkout quote and reservations active for 30 minutes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutSession'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /checkout-sessions/{checkoutSessionId}:
    get:
      operationId: getCheckoutSession
      tags: [Checkout]
      security:
        - SessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CheckoutSessionId'
      responses:
        '200':
          description: Current session status and quote.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutSession'
        '404':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /checkout-sessions/{checkoutSessionId}/payment-attempts:
    post:
      operationId: createPaymentAttempt
      tags: [Checkout]
      summary: Start payment through the configured provider.
      security:
        - SessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CheckoutSessionId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '201':
          description: Payment attempt created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentAttempt'
        '409':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /payment-attempts/{paymentAttemptId}:
    get:
      operationId: getPaymentAttempt
      tags: [Checkout]
      summary: Read the current owned payment outcome without causing a payment effect.
      security:
        - SessionCookie: []
      parameters:
        - $ref: '#/components/parameters/PaymentAttemptId'
      responses:
        '200':
          description: Current immutable or retryable payment result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentAttempt'
        '404':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /fake-payment-attempts/{paymentAttemptId}/complete:
    post:
      operationId: completeFakePaymentAttempt
      tags: [Checkout]
      summary: Simulate the configured Fake Payment provider in non-production environments.
      description: Production startup rejects the Fake Payment Adapter, so this route can never serve production traffic.
      security:
        - SessionCookie: []
      parameters:
        - $ref: '#/components/parameters/PaymentAttemptId'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FakePaymentCompletionInput'
      responses:
        '200':
          description: Fake provider callback processed through the normal verification boundary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentCallbackOutcome'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /payment-callbacks/{provider}:
    post:
      operationId: processPaymentCallback
      tags: [Checkout]
      summary: Provider callback; provider-specific signature is required.
      security: []
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            enum: [fake]
        - name: X-Payment-Signature
          in: header
          required: true
          description: Provider-specific callback authenticator verified before commercial state changes.
          schema:
            type: string
            minLength: 64
            maxLength: 256
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FakePaymentCallback'
      responses:
        '200':
          description: Verified callback processed idempotently.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentCallbackOutcome'
        '400':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /admin/categories:
    get:
      operationId: listAdminCategories
      tags: [Admin Catalog]
      summary: List categories for catalog administration.
      security:
        - SessionCookie: [catalog:read]
      responses:
        '200':
          description: Administrative category list.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminCategory'
        '401':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: createAdminCategory
      tags: [Admin Catalog]
      summary: Create a draft or published catalog category.
      security:
        - SessionCookie: [catalog:write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminCategoryInput'
      responses:
        '201':
          description: Draft category created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminCategory'
        '409':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /admin/media:
    get:
      operationId: listAdminMedia
      tags: [Admin Content]
      summary: List reusable media metadata.
      security:
        - SessionCookie: [catalog:read]
      responses:
        '200':
          description: Reusable media assets.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Media'
        '401':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: createAdminMedia
      tags: [Admin Content]
      summary: Register reusable media metadata.
      security:
        - SessionCookie: [catalog:write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminMediaInput'
      responses:
        '201':
          description: Reusable media metadata registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Media'
        '422':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /admin/products:
    get:
