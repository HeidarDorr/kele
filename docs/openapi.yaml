      parameters:
        - $ref: '#/components/parameters/OutfitId'
      responses:
        '200':
          description: Protected Outfit preview with derived current availability.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminOutfitPreview'
        '404':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /admin/outfits/{outfitId}/publish:
    post:
      operationId: publishAdminOutfit
