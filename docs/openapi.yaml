      type: string
      enum: [draft, published, historical]

    AdminOutfit:
      allOf:
        - $ref: '#/components/schemas/AdminOutfitInput'
        - type: object
          additionalProperties: false
          required:
            - id
            - status
            - version
            - revisionId
            - revisionNumber
            - revisionState
            - publishedAt
          properties:
            id:
              type: string
              format: uuid
            status:
              $ref: '#/components/schemas/PublicationStatus'
            version:
              type: integer
              minimum: 1
            revisionId:
              type: string
              format: uuid
            revisionNumber:
              type: integer
              minimum: 1
            revisionState:
              $ref: '#/components/schemas/OutfitRevisionState'
            publishedAt:
              type: [string, 'null']
              format: date-time

    AdminOutfitPage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AdminOutfit'
        page:
          $ref: '#/components/schemas/CursorPage'

    OutfitRevisionSummary:
      type: object
      additionalProperties: false
      required: [id, revisionNumber, state, name, publishedAt, createdAt]
      properties:
        id:
          type: string
          format: uuid
        revisionNumber:
          type: integer
          minimum: 1
        state:
          $ref: '#/components/schemas/OutfitRevisionState'
        name:
          type: string
        publishedAt:
          type: [string, 'null']
          format: date-time
        createdAt:
          type: string
          format: date-time

    AdminOutfitPreview:
      type: object
      additionalProperties: false
      required: [preview, outfit]
      properties:
        preview:
