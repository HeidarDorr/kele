        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Homepage'
      responses:
        '200':
          description: Homepage saved and publicly visible.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Homepage'
        '409':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /admin/settings/shipping:
    get:
      operationId: getAdminShippingSettings
      tags: [Admin Content]
      security:
        - SessionCookie: [settings:read]
      responses:
        '200':
          description: Effective shipping configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShippingSettings'
        default:
          $ref: '#/components/responses/Problem'
    patch:
      operationId: updateAdminShippingSettings
      tags: [Admin Content]
      security:
        - SessionCookie: [settings:write]
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShippingSettingsInput'
      responses:
        '200':
          description: New effective version of shipping settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShippingSettings'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
components:
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: kele_session
      description: Secure server-managed customer or administrator session.
    AnonymousCart:
      type: apiKey
      in: cookie
      name: kele_cart
      description: Signed high-entropy anonymous cart identifier.

  parameters:
    PageCursor:
      name: cursor
      in: query
      schema:
        type: string
        maxLength: 500
    PageSize:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 24
    Slug:
      name: slug
      in: path
      required: true
      schema:
        type: string
        pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
        maxLength: 160
    LineId:
      name: lineId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AddressId:
      name: addressId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CheckoutSessionId:
      name: checkoutSessionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PaymentAttemptId:
      name: paymentAttemptId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProductId:
      name: productId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OutfitId:
      name: outfitId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SkuId:
      name: skuId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ReturnId:
      name: returnId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OrderNumber:
      name: orderNumber
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 40
    RefundId:
      name: refundId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    BulkOperationId:
      name: bulkOperationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        High-entropy command replay key. Sensitive Milestone 6 commands persist
        a global SHA-256 fingerprint over fingerprint version, command type,
        target, optimistic resource version (or null) and normalized payload.
        An exact replay returns the current result without another side effect;
        reuse for any different fingerprint returns 409
        `IDEMPOTENCY_KEY_REUSED` before a business mutation.
      schema:
        type: string
        minLength: 16
        maxLength: 120
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Optimistic resource version.
      schema:
        type: string
        pattern: '^"[0-9]+"$'
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: Double-submit token matching the signed anti-CSRF cookie.
      schema:
        type: string
        minLength: 32
        maxLength: 256
    OptionalCsrfToken:
      name: X-CSRF-Token
      in: header
      required: false
      description: Required when an anonymous-cart cookie is presented for merge.
      schema:
        type: string
        minLength: 32
        maxLength: 256

  responses:
    Problem:
      description: RFC 9457-style problem response.
      headers:
        X-Correlation-Id:
          schema:
            type: string
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  headers:
    CorrelationId:
      description: Resolved request correlation identifier. A valid caller-supplied UUID is preserved; otherwise the API generates one.
      schema:
        type: string
        format: uuid

  schemas:
    HealthStatus:
      type: object
      additionalProperties: false
      required: [status, correlationId]
      properties:
        status:
          type: string
          const: ok
        correlationId:
          type: string
          format: uuid

    HealthUnavailable:
      type: object
      additionalProperties: false
      required: [status, correlationId]
      properties:
        status:
          type: string
          const: unavailable
        correlationId:
          type: string
          format: uuid

    PublicationStatus:
      type: string
      enum: [draft, published, archived]

    Money:
      type: object
      additionalProperties: false
      required: [amountRial, currency, display]
      properties:
        amountRial:
          type: integer
          format: int64
          minimum: 0
          description: Authoritative integer amount in Iranian rials.
        currency:
          type: string
          const: IRR
        display:
          type: string
          description: Localized display string, such as a toman presentation.

    Mobile:
      type: string
      description: Normalized Iranian mobile number in E.164 form.
      pattern: "^\\+98[0-9]{10}$"

    CategorySummary:
      type: object
      additionalProperties: false
      required: [id, slug, name, description, displayOrder]
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        description:
          type: [string, 'null']
        displayOrder:
          type: integer
          minimum: 0

    CategoryPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CategorySummary'

    CategoryDetail:
      allOf:
        - $ref: '#/components/schemas/CategorySummary'
        - type: object
          required: [products, seo]
          properties:
            products:
              $ref: '#/components/schemas/ProductCardPage'
            seo:
              $ref: '#/components/schemas/Seo'

    Media:
      type: object
      additionalProperties: false
      required: [id, url, width, height, alt, focalPoint]
      properties:
        id:
          type: string
          format: uuid
        url:
          type: string
          format: uri-reference
        width:
          type: integer
          minimum: 1
        height:
          type: integer
          minimum: 1
        alt:
          type: string
        focalPoint:
          type: object
          required: [x, y]
          properties:
            x:
              type: number
              minimum: 0
              maximum: 1
            y:
              type: number
              minimum: 0
              maximum: 1

    ProductCard:
      type: object
      additionalProperties: false
      required: [productId, slug, name, selectedVariant, availableColors, price, available]
      properties:
        productId:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        selectedVariant:
          $ref: '#/components/schemas/ColorVariantSummary'
        availableColors:
          type: array
          items:
            $ref: '#/components/schemas/ColorSwatch'
        price:
          $ref: '#/components/schemas/Money'
        available:
          type: boolean

    ProductCardPage:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ProductCard'
        page:
          $ref: '#/components/schemas/CursorPage'

    CursorPage:
      type: object
      required: [hasMore]
      properties:
        nextCursor:
          type: [string, 'null']
        hasMore:
          type: boolean

    ColorSwatch:
      type: object
      required: [variantId, name, available]
      properties:
        variantId:
          type: string
          format: uuid
        name:
          type: string
        hex:
          type: [string, 'null']
          pattern: '^#[0-9A-Fa-f]{6}$'
        available:
          type: boolean

    ColorVariantSummary:
      type: object
      required: [id, name, featuredMedia]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        featuredMedia:
          $ref: '#/components/schemas/Media'

    SkuOption:
      type: object
      required: [id, code, size, available, price]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        size:
          type: string
        available:
          type: boolean
        price:
          $ref: '#/components/schemas/Money'

    ProductDetail:
      allOf:
        - $ref: '#/components/schemas/ProductCard'
        - type: object
          required: [description, variants, categories, seo, updatedAt]
          properties:
            description:
              type: string
            details:
              type: array
              items:
                type: string
            variants:
              type: array
              items:
                type: object
                required: [id, name, gallery, skus]
                properties:
                  id:
                    type: string
                    format: uuid
                  name:
                    type: string
                  gallery:
                    type: array
                    minItems: 1
                    items:
                      $ref: '#/components/schemas/Media'
                  skus:
                    type: array
                    items:
                      $ref: '#/components/schemas/SkuOption'
            categories:
              type: array
              items:
                $ref: '#/components/schemas/CategorySummary'
            seo:
              $ref: '#/components/schemas/Seo'
            updatedAt:
              type: string
              format: date-time

    OutfitCard:
      type: object
      additionalProperties: false
      required:
        [id, revisionId, revisionNumber, slug, name, featuredMedia, startingPrice, available]
      properties:
        id:
          type: string
          format: uuid
        revisionId:
          type: string
          format: uuid
        revisionNumber:
          type: integer
          minimum: 1
        slug:
          type: string
        name:
          type: string
        featuredMedia:
          $ref: '#/components/schemas/Media'
        startingPrice:
          $ref: '#/components/schemas/Money'
        available:
          type: boolean

    OutfitCardPage:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/OutfitCard'
        page:
          $ref: '#/components/schemas/CursorPage'

    OutfitDetail:
      allOf:
        - $ref: '#/components/schemas/OutfitCard'
        - type: object
          additionalProperties: false
          required: [description, gallery, sizes, items, categories, seo, updatedAt]
          properties:
            description:
              type: string
            gallery:
              type: array
              minItems: 1
              items:
                $ref: '#/components/schemas/Media'
            sizes:
              type: array
              minItems: 1
              items:
                $ref: '#/components/schemas/OutfitSizeOption'
            items:
              type: array
              minItems: 1
              items:
                $ref: '#/components/schemas/OutfitItemView'
            categories:
              type: array
              items:
                $ref: '#/components/schemas/CategorySummary'
            seo:
              $ref: '#/components/schemas/Seo'
            updatedAt:
              type: string
              format: date-time

    OutfitSizeOption:
      type: object
      additionalProperties: false
      required: [code, label, price, available, availableQuantity]
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 40
        label:
          type: string
          minLength: 1
          maxLength: 80
        price:
          $ref: '#/components/schemas/Money'
        available:
          type: boolean
        availableQuantity:
          type: integer
          minimum: 0

    OutfitItemView:
      type: object
      additionalProperties: false
      required: [id, productId, productSlug, variantId, name, colorName, quantity, featuredMedia]
      properties:
        id:
          type: string
          format: uuid
        productId:
          type: string
          format: uuid
        productSlug:
          type: string
        variantId:
          type: string
          format: uuid
        name:
          type: string
        colorName:
          type: string
        quantity:
          type: integer
          minimum: 1
        featuredMedia:
          $ref: '#/components/schemas/Media'

    Seo:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        canonicalPath:
          type: string

    Customer:
      type: object
      required: [id, mobile]
      properties:
        id:
          type: string
          format: uuid
        mobile:
          $ref: '#/components/schemas/Mobile'
        firstName:
          type: [string, 'null']
        lastName:
          type: [string, 'null']

    AuthenticationResult:
      type: object
      additionalProperties: false
      required: [customer, cart, mergePerformed]
      properties:
        customer:
          $ref: '#/components/schemas/Customer'
        cart:
          $ref: '#/components/schemas/Cart'
        mergePerformed:
          type: boolean

    AddressInput:
      type: object
      additionalProperties: false
      required: [recipientName, recipientMobile, province, city, addressLine, postalCode]
      properties:
        recipientName:
          type: string
          minLength: 2
          maxLength: 160
        recipientMobile:
          $ref: '#/components/schemas/Mobile'
        province:
          type: string
          minLength: 1
          maxLength: 100
        city:
          type: string
          minLength: 1
          maxLength: 100
        addressLine:
          type: string
          minLength: 5
          maxLength: 500
        postalCode:
          type: string
          pattern: '^[0-9]{10}$'
        isDefault:
          type: boolean
          default: false

    Address:
      allOf:
        - $ref: '#/components/schemas/AddressInput'
        - type: object
          required: [id]
          properties:
            id:
              type: string
              format: uuid

    AddressSnapshot:
      type: object
      additionalProperties: false
      required:
        - recipientName
        - recipientMobile
        - province
        - city
        - addressLine
        - postalCode
      properties:
        recipientName:
          type: string
        recipientMobile:
          $ref: '#/components/schemas/Mobile'
        province:
          type: string
        city:
          type: string
        addressLine:
          type: string
        postalCode:
          type: string
        normalizedZone:
          type: [string, 'null']

    ShippingMethodCode:
      type: string
      enum: [iran_post, tipax, tehran_local_courier]

    ShippingOption:
      type: object
      additionalProperties: false
      required:
        - method
        - name
        - eligible
        - quotedPrice
        - fixedPrice
        - eligibilitySubtotal
        - freeShippingApplied
        - freeShippingThreshold
        - settingsVersion
      properties:
        method:
          $ref: '#/components/schemas/ShippingMethodCode'
        name:
          type: string
        eligible:
          type: boolean
        ineligibilityCode:
          type: [string, 'null']
        quotedPrice:
          $ref: '#/components/schemas/Money'
        fixedPrice:
          $ref: '#/components/schemas/Money'
        eligibilitySubtotal:
          $ref: '#/components/schemas/Money'
        freeShippingApplied:
          type: boolean
        freeShippingThreshold:
          anyOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
        settingsVersion:
          type: integer
          minimum: 1

    ShippingSettingsInput:
      type: object
      additionalProperties: false
      required: [methods, eligibilityBasis, reason]
      properties:
        eligibilityBasis:
          type: string
          const: order_subtotal
          description: Products and Outfits only; excludes shipping, discounts, and taxes.
        methods:
          type: array
          minItems: 3
          maxItems: 3
          items:
            type: object
            additionalProperties: false
            required: [code, enabled, fixedPriceRial]
            properties:
              code:
                $ref: '#/components/schemas/ShippingMethodCode'
              enabled:
                type: boolean
              fixedPriceRial:
                type: integer
                minimum: 0
        freeShippingThresholdRial:
          type: [integer, 'null']
          minimum: 0
          description: Compared with Order Subtotal.
        reason:
          type: string
          minLength: 3
          maxLength: 500

    ShippingSettings:
      allOf:
        - $ref: '#/components/schemas/ShippingSettingsInput'
        - type: object
          required: [version, effectiveAt]
          properties:
            version:
              type: integer
              minimum: 1
            effectiveAt:
              type: string
              format: date-time

    ProductCartLineInput:
      type: object
      additionalProperties: false
      required: [kind, skuId, quantity]
      properties:
        kind:
          type: string
          const: product
        skuId:
          type: string
          format: uuid
        quantity:
          type: integer
          minimum: 1
          maximum: 20

    OutfitCartLineInput:
      type: object
      additionalProperties: false
      required: [kind, outfitRevisionId, size, quantity]
      properties:
        kind:
          type: string
          const: outfit
        outfitRevisionId:
          type: string
          format: uuid
        size:
          type: string
        quantity:
          type: integer
          minimum: 1
          maximum: 20

    Cart:
      type: object
      additionalProperties: false
      required: [id, version, lines, informationalTotal, mergeNotices, checkoutBlocked]
      properties:
        id:
          type: string
          format: uuid
        version:
          type: integer
          minimum: 0
        lines:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - id
              - kind
              - title
              - quantity
              - status
              - checkoutBlocking
              - unitPrice
              - outfitRevisionId
              - outfitRevisionNumber
              - outfitSize
            properties:
              id:
                type: string
                format: uuid
              kind:
                type: string
                enum: [product, outfit]
              title:
                type: string
              selection:
                type: string
              skuCode:
                type: [string, 'null']
              outfitRevisionId:
                type: [string, 'null']
                format: uuid
              outfitRevisionNumber:
                type: [integer, 'null']
                minimum: 1
              outfitSize:
                type: [string, 'null']
              image:
                anyOf:
                  - $ref: '#/components/schemas/Media'
                  - type: 'null'
              quantity:
                type: integer
                minimum: 1
              status:
                type: string
                enum: [available, unavailable, requires_review]
              checkoutBlocking:
                type: boolean
              unitPrice:
                $ref: '#/components/schemas/Money'
        informationalTotal:
          $ref: '#/components/schemas/Money'
        checkoutBlocked:
          type: boolean
        mergeNotices:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, code, lineId]
            properties:
              id:
                type: string
                format: uuid
              code:
                type: string
                enum:
                  - quantity_reduced_to_inventory
                  - sku_unavailable
                  - outfit_revision_requires_review
              lineId:
                type: string
                format: uuid
              requestedQuantity:
                type: [integer, 'null']
                minimum: 1
              appliedQuantity:
                type: [integer, 'null']
                minimum: 1

    CheckoutSession:
      type: object
      additionalProperties: false
      required: [id, status, createdAt, expiresAt, lines, quote, address, shipping]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [active, payment_pending, paid, expired, cancelled, reconciliation]
        expiresAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        lines:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/CheckoutLineSnapshot'
        quote:
          type: object
          additionalProperties: false
          required: [itemsTotal, shippingTotal, payableTotal]
          properties:
            itemsTotal:
              $ref: '#/components/schemas/Money'
            shippingTotal:
              $ref: '#/components/schemas/Money'
            payableTotal:
              $ref: '#/components/schemas/Money'
        shipping:
          $ref: '#/components/schemas/ShippingOption'
        address:
          $ref: '#/components/schemas/AddressSnapshot'
        orderNumber:
          type: [string, 'null']

    CheckoutLineSnapshot:
      type: object
      additionalProperties: false
      required:
        - id
        - kind
        - title
        - selection
        - quantity
        - unitPrice
        - lineTotal
        - outfitRevisionId
        - outfitRevisionNumber
        - outfitSize
        - outfitComponents
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum: [product, outfit]
        title:
          type: string
        selection:
          type: string
        skuCode:
          type: [string, 'null']
        outfitRevisionId:
          type: [string, 'null']
          format: uuid
        outfitRevisionNumber:
          type: [integer, 'null']
          minimum: 1
        outfitSize:
          type: [string, 'null']
        image:
          anyOf:
            - $ref: '#/components/schemas/Media'
            - type: 'null'
        quantity:
          type: integer
          minimum: 1
        unitPrice:
          $ref: '#/components/schemas/Money'
        lineTotal:
          $ref: '#/components/schemas/Money'
        outfitComponents:
          type: array
          items:
            $ref: '#/components/schemas/OutfitComponentSnapshot'

    OutfitComponentSnapshot:
      type: object
      additionalProperties: false
      required:
        - skuId
        - skuCode
        - productName
        - colorName
        - sizeLabel
        - quantityPerOutfit
        - totalQuantity
      properties:
        skuId:
          type: string
          format: uuid
        skuCode:
          type: string
        productName:
          type: string
        colorName:
          type: string
        sizeLabel:
          type: string
        quantityPerOutfit:
          type: integer
          minimum: 1
        totalQuantity:
          type: integer
          minimum: 1

    PaymentAttempt:
      type: object
      additionalProperties: false
      required:
        - id
        - checkoutSessionId
        - provider
        - status
        - amount
        - redirectUrl
        - orderNumber
        - reconciliationReason
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        checkoutSessionId:
          type: string
          format: uuid
        provider:
          type: string
          enum: [fake]
        status:
          type: string
          enum: [created, redirected, verified, failed, cancelled, pending, reconciliation]
        amount:
          $ref: '#/components/schemas/Money'
        redirectUrl:
          type: [string, 'null']
          format: uri
        orderNumber:
          type: [string, 'null']
        reconciliationReason:
          type: [string, 'null']
        createdAt:
          type: string
          format: date-time

    FakePaymentCompletionInput:
      type: object
      additionalProperties: false
      required: [outcome]
      properties:
        outcome:
          type: string
          enum: [success, failed, cancelled, pending, tampered_amount]

    FakePaymentCallback:
      type: object
      additionalProperties: false
      required:
        - providerReference
        - providerTransactionId
        - status
        - amountRial
        - currency
        - issuedAt
        - nonce
      properties:
        providerReference:
          type: string
          minLength: 1
          maxLength: 120
        providerTransactionId:
          type: string
          minLength: 1
          maxLength: 120
        status:
          type: string
          enum: [success, failed, cancelled, pending]
        amountRial:
          type: integer
          format: int64
          minimum: 1
        currency:
          type: string
          const: IRR
        issuedAt:
          type: string
          format: date-time
        nonce:
          type: string
          minLength: 16
          maxLength: 120

    PaymentCallbackOutcome:
      type: object
      additionalProperties: false
      required: [status, paymentAttemptId, orderNumber]
      properties:
        status:
          type: string
          enum: [paid, failed, cancelled, pending, reconciliation]
        paymentAttemptId:
          type: string
          format: uuid
        orderNumber:
          type: [string, 'null']

    OrderPage:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderSummary'
        page:
          $ref: '#/components/schemas/CursorPage'

    OrderSummary:
      type: object
      required: [orderNumber, createdAt, fulfillmentStatus, paidTotal, version]
      properties:
        orderNumber:
          type: string
        createdAt:
          type: string
          format: date-time
        fulfillmentStatus:
          $ref: '#/components/schemas/OrderFulfillmentStatus'
        paidTotal:
          $ref: '#/components/schemas/Money'
        version:
          type: integer
          minimum: 1

    OrderFulfillmentStatus:
      type: string
      enum: [paid, preparing, shipped, delivered, cancelled, returned]

    Order:
      allOf:
        - $ref: '#/components/schemas/OrderSummary'
        - type: object
          additionalProperties: false
          required:
            - paidAt
            - itemsSubtotal
            - shippingTotal
            - items
            - address
            - shipping
            - payment
            - tracking
            - timeline
            - returnEligibility
            - returns
            - refunds
          properties:
            paidAt:
              type: string
              format: date-time
            itemsSubtotal:
              $ref: '#/components/schemas/Money'
            shippingTotal:
              $ref: '#/components/schemas/Money'
            items:
              type: array
              minItems: 1
              items:
                type: object
                additionalProperties: false
                required:
                  - id
                  - kind
                  - title
                  - selection
                  - skuCode
                  - quantity
                  - unitPrice
                  - lineTotal
                  - outfitRevisionId
                  - outfitRevisionNumber
                  - outfitSize
                  - outfitComponents
                properties:
                  id:
                    type: string
                    format: uuid
                  kind:
                    type: string
                    enum: [product, outfit]
                  title:
                    type: string
                  selection:
                    type: string
                  skuCode:
                    type: [string, 'null']
                  outfitRevisionId:
                    type: [string, 'null']
                    format: uuid
                  outfitRevisionNumber:
                    type: [integer, 'null']
                    minimum: 1
                  outfitSize:
                    type: [string, 'null']
                  quantity:
                    type: integer
                    minimum: 1
                  unitPrice:
                    $ref: '#/components/schemas/Money'
                  lineTotal:
                    $ref: '#/components/schemas/Money'
                  outfitComponents:
                    type: array
                    items:
                      $ref: '#/components/schemas/OutfitComponentSnapshot'
            address:
              $ref: '#/components/schemas/AddressSnapshot'
            shipping:
              type: object
              additionalProperties: false
              required:
                - method
                - name
                - chargedPrice
                - fixedPrice
                - freeShippingApplied
                - freeShippingThreshold
                - settingsVersion
              properties:
                method:
                  $ref: '#/components/schemas/ShippingMethodCode'
                name:
                  type: string
                chargedPrice:
                  $ref: '#/components/schemas/Money'
                fixedPrice:
                  $ref: '#/components/schemas/Money'
                freeShippingApplied:
                  type: boolean
                freeShippingThreshold:
                  anyOf:
                    - $ref: '#/components/schemas/Money'
                    - type: 'null'
                settingsVersion:
                  type: integer
                  minimum: 1
            payment:
              type: object
              additionalProperties: false
              required: [provider, providerTransactionId]
              properties:
                provider:
                  type: string
                  enum: [fake]
                providerTransactionId:
                  type: string
            tracking:
              anyOf:
                - $ref: '#/components/schemas/TrackingRevision'
                - type: 'null'
            timeline:
              type: array
              items:
                $ref: '#/components/schemas/OrderTimelineEvent'
            returnEligibility:
              $ref: '#/components/schemas/ReturnEligibility'
            returns:
              type: array
              items:
                $ref: '#/components/schemas/ReturnRequest'
            refunds:
              type: array
              items:
                $ref: '#/components/schemas/Refund'

    AdminOrder:
      allOf:
        - $ref: '#/components/schemas/Order'
        - type: object
          required: [customerId]
          properties:
            customerId:
              type: string
              format: uuid

    AdminOrderPage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AdminOrder'
        page:
          $ref: '#/components/schemas/CursorPage'

    OrderTransitionInput:
      type: object
      additionalProperties: false
      required: [toStatus, reason]
      properties:
        toStatus:
          type: string
          description: Explicit staff-command targets; Returned is derived only after a completed full return.
          enum: [preparing, shipped, delivered, cancelled]
        reason:
          type: string
          minLength: 3
          maxLength: 500
        tracking:
          $ref: '#/components/schemas/TrackingInput'

    TrackingInput:
      type: object
      additionalProperties: false
      required: [carrier, trackingNumber]
      properties:
        carrier:
          type: string
          minLength: 2
          maxLength: 120
        trackingNumber:
          type: string
          minLength: 2
          maxLength: 160
        trackingUrl:
          type: [string, 'null']
          format: uri
          maxLength: 1000

    TrackingRevision:
      allOf:
        - $ref: '#/components/schemas/TrackingInput'
        - type: object
          required: [id, recordedAt]
          properties:
            id:
              type: string
              format: uuid
            recordedAt:
              type: string
              format: date-time

    TrackingRevisionInput:
      type: object
      additionalProperties: false
      required: [carrier, trackingNumber, reason]
      properties:
        carrier:
          type: string
          minLength: 2
          maxLength: 120
        trackingNumber:
          type: string
          minLength: 2
          maxLength: 160
        trackingUrl:
          type: [string, 'null']
          format: uri
          maxLength: 1000
        reason:
          type: string
          minLength: 3
          maxLength: 500

    OrderTimelineEvent:
      type: object
      additionalProperties: false
      required: [id, type, fromStatus, toStatus, actorId, reason, occurredAt]
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum:
            [
              created,
              fulfillment_transition,
              tracking_updated,
              return_submitted,
              return_decided,
              refund_updated,
            ]
        fromStatus:
          anyOf:
            - $ref: '#/components/schemas/OrderFulfillmentStatus'
            - type: 'null'
        toStatus:
          anyOf:
            - $ref: '#/components/schemas/OrderFulfillmentStatus'
            - type: 'null'
        actorId:
          type: string
        reason:
          type: [string, 'null']
        occurredAt:
          type: string
          format: date-time

    ReturnEligibility:
      type: object
      additionalProperties: false
      required: [eligible, deliveredAt, deadline, code]
      properties:
        eligible:
          type: boolean
        deliveredAt:
          type: [string, 'null']
          format: date-time
        deadline:
          type: [string, 'null']
          format: date-time
        code:
          type: string
          enum: [eligible, not_delivered, window_expired, no_remaining_quantity]

    ReturnStatus:
      type: string
      enum: [submitted, approved, rejected, refund_pending, completed]

    ReturnRequestInput:
      type: object
      additionalProperties: false
      required:
        - orderNumber
        - items
        - reason
        - unused
        - unwashed
        - tagsAttached
      properties:
        orderNumber:
          type: string
          minLength: 1
          maxLength: 40
        items:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [orderItemId, quantity]
            properties:
              orderItemId:
                type: string
                format: uuid
              quantity:
                type: integer
                minimum: 1
        reason:
          type: string
          minLength: 3
          maxLength: 1000
        unused:
          type: boolean
          const: true
        unwashed:
          type: boolean
          const: true
        tagsAttached:
          type: boolean
          const: true

    ReturnRequest:
      allOf:
        - $ref: '#/components/schemas/ReturnRequestInput'
        - type: object
          required:
            - id
            - status
            - requestedAt
            - deliveryConfirmedAt
            - eligibilityDeadline
          properties:
            id:
              type: string
              format: uuid
            status:
              $ref: '#/components/schemas/ReturnStatus'
            requestedAt:
              type: string
              format: date-time
            deliveryConfirmedAt:
              type: string
              format: date-time
            eligibilityDeadline:
              type: string
              format: date-time
            decidedAt:
              type: [string, 'null']
              format: date-time
            decisionReason:
              type: [string, 'null']
            refund:
              anyOf:
                - $ref: '#/components/schemas/Refund'
                - type: 'null'

    ReturnDecisionInput:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 3
          maxLength: 1000

    RefundStatus:
      type: string
      enum: [pending_provider, confirmed, failed]

    Refund:
      type: object
      additionalProperties: false
      required: [id, orderNumber, amount, provider, status, requestedAt, confirmedAt, failureCode]
      properties:
        id:
          type: string
          format: uuid
        orderNumber:
          type: string
        amount:
          $ref: '#/components/schemas/Money'
        provider:
          type: string
          enum: [fake]
        providerReference:
          type: [string, 'null']
        status:
          $ref: '#/components/schemas/RefundStatus'
        requestedAt:
          type: string
          format: date-time
        confirmedAt:
          type: [string, 'null']
          format: date-time
        failureCode:
          type: [string, 'null']

    Inventory:
      type: object
      required: [skuId, physicalQuantity, reservedQuantity, availableQuantity, version]
      properties:
        skuId:
          type: string
          format: uuid
        physicalQuantity:
          type: integer
          minimum: 0
        reservedQuantity:
          type: integer
          minimum: 0
        availableQuantity:
          type: integer
          minimum: 0
        version:
          type: integer
          minimum: 0

    AuditEvent:
      type: object
      additionalProperties: false
      required: [id, eventType, actorId, entityType, entityId, correlationId, payload, occurredAt]
      properties:
        id:
          type: string
          format: uuid
        eventType:
          type: string
        actorId:
          type: string
        entityType:
          type: string
        entityId:
          type: string
        correlationId:
          type: string
          format: uuid
        payload:
          type: object
          additionalProperties: true
        occurredAt:
          type: string
          format: date-time

    AuditEventPage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AuditEvent'
        page:
          $ref: '#/components/schemas/CursorPage'

    BulkCatalogFilters:
      type: object
      additionalProperties: false
      properties:
        skuIds:
          type: array
          uniqueItems: true
          maxItems: 500
          items:
            type: string
            format: uuid
        productIds:
          type: array
          uniqueItems: true
          maxItems: 100
          items:
            type: string
            format: uuid
        categoryIds:
          type: array
          uniqueItems: true
          maxItems: 100
          items:
            type: string
            format: uuid
        statuses:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/PublicationStatus'
        sizes:
          type: array
          uniqueItems: true
          maxItems: 40
          items:
            type: string
            maxLength: 40

    PriceBulkPreviewInput:
      type: object
      additionalProperties: false
      required: [filters, adjustment, reason]
      properties:
        filters:
          $ref: '#/components/schemas/BulkCatalogFilters'
        adjustment:
          type: object
          additionalProperties: false
          required: [type, value]
          properties:
            type:
              type: string
              enum: [fixed_amount, percentage_increase, percentage_decrease]
            value:
              type: integer
              minimum: 1
        reason:
          type: string
          minLength: 3
          maxLength: 500

    InventoryBulkPreviewInput:
      type: object
      additionalProperties: false
      required: [filters, action, quantity, reason]
      properties:
        filters:
          $ref: '#/components/schemas/BulkCatalogFilters'
        action:
          type: string
          enum: [production, manual_correction, damaged_goods]
        quantity:
          type: integer
          not:
            const: 0
        reason:
          type: string
          minLength: 3
          maxLength: 500

    BulkOperation:
      type: object
      additionalProperties: false
      required: [id, kind, status, reason, version, expiresAt, items, summary, createdAt]
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum: [price, inventory]
        status:
          type: string
          enum: [previewed, applied, partial_failed, failed]
        reason:
          type: string
        version:
          type: integer
          minimum: 1
        expiresAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        appliedAt:
          type: [string, 'null']
          format: date-time
        summary:
          type: object
          additionalProperties: false
          required: [total, succeeded, failed]
          properties:
            total:
              type: integer
              minimum: 0
            succeeded:
              type: integer
              minimum: 0
            failed:
              type: integer
              minimum: 0
        items:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              [skuId, skuCode, beforeValue, proposedValue, expectedVersion, status, failureCode]
            properties:
              skuId:
                type: string
                format: uuid
              skuCode:
                type: string
              beforeValue:
                type: integer
              proposedValue:
                type: integer
              expectedVersion:
                type: integer
                minimum: 1
              status:
                type: string
                enum: [valid, applied, failed]
              failureCode:
                type: [string, 'null']

    AdminCategoryInput:
      type: object
      additionalProperties: false
      required: [name, slug, displayOrder]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        slug:
          type: string
          pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
          maxLength: 160
        description:
          type: [string, 'null']
          maxLength: 2000
        displayOrder:
          type: integer
          minimum: 0
        status:
          $ref: '#/components/schemas/PublicationStatus'

    AdminCategory:
      allOf:
        - $ref: '#/components/schemas/AdminCategoryInput'
        - type: object
          required: [id, status, version]
          properties:
            id:
              type: string
              format: uuid
            status:
              $ref: '#/components/schemas/PublicationStatus'
            version:
              type: integer
              minimum: 0

    AdminMediaInput:
      type: object
      additionalProperties: false
      required: [url, width, height, alt, format, group]
      properties:
        url:
          type: string
          format: uri-reference
        width:
          type: integer
          minimum: 1
        height:
          type: integer
          minimum: 1
        alt:
          type: string
          minLength: 1
          maxLength: 500
        format:
          type: string
          enum: [jpg, png, webp]
        group:
          type: string
          enum: [product_images, outfit_editorial, homepage, journal, shared_assets]
        focalPoint:
          type: object
          additionalProperties: false
          required: [x, y]
          properties:
            x:
              type: number
              minimum: 0
              maximum: 1
            y:
              type: number
              minimum: 0
              maximum: 1

    AdminSkuInput:
      type: object
      additionalProperties: false
      required: [code, normalizedSize, displaySize, amountRial, physicalQuantity]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          pattern: '^[A-Z0-9][A-Z0-9_-]{2,63}$'
        normalizedSize:
          type: string
          minLength: 1
          maxLength: 40
        displaySize:
          type: string
          minLength: 1
          maxLength: 40
        amountRial:
          type: integer
          format: int64
          minimum: 1
        physicalQuantity:
          type: integer
          minimum: 0
        status:
          $ref: '#/components/schemas/PublicationStatus'

    AdminColorVariantInput:
      type: object
      additionalProperties: false
      required: [name, normalizedColorCode, displayOrder, mediaIds, featuredMediaId, skus]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 100
        normalizedColorCode:
          type: string
          pattern: '^[a-z0-9][a-z0-9_-]{0,39}$'
        hex:
          type: [string, 'null']
          pattern: '^#[0-9A-Fa-f]{6}$'
        displayOrder:
          type: integer
          minimum: 0
        mediaIds:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            format: uuid
        featuredMediaId:
          type: string
          format: uuid
        skus:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/AdminSkuInput'
        status:
          $ref: '#/components/schemas/PublicationStatus'

    AdminProductInput:
      type: object
      additionalProperties: false
      required: [name, slug, description, categoryIds, variants]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 180
        slug:
          type: string
          pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
          maxLength: 160
        description:
          type: string
          maxLength: 10000
        categoryIds:
          type: array
          uniqueItems: true
          items:
            type: string
            format: uuid
        seo:
          $ref: '#/components/schemas/Seo'
        details:
          type: array
          maxItems: 20
          items:
            type: string
            maxLength: 500
        variants:
          type: array
          items:
            $ref: '#/components/schemas/AdminColorVariantInput'

    AdminProduct:
      allOf:
        - $ref: '#/components/schemas/AdminProductInput'
        - type: object
          required: [id, status, version, variants]
          properties:
            id:
              type: string
              format: uuid
            status:
              $ref: '#/components/schemas/PublicationStatus'
            version:
              type: integer
              minimum: 0
            variants:
              type: array
              items:
                $ref: '#/components/schemas/AdminColorVariantInput'

    AdminProductPage:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AdminProduct'
        page:
          $ref: '#/components/schemas/CursorPage'

    AdminOutfitComponentInput:
      type: object
      additionalProperties: false
      required: [outfitItemId, skuId, quantity, displayOrder]
      properties:
        outfitItemId:
          type: string
          format: uuid
        skuId:
          type: string
          format: uuid
        quantity:
          type: integer
          minimum: 1
          maximum: 20
        displayOrder:
          type: integer
          minimum: 0

    AdminOutfitSizeInput:
      type: object
      additionalProperties: false
      required: [code, label, amountRial, displayOrder, components]
      properties:
        code:
          type: string
          pattern: '^[A-Za-z0-9][A-Za-z0-9_-]{0,39}$'
        label:
          type: string
          minLength: 1
          maxLength: 80
        amountRial:
          type: integer
          format: int64
          minimum: 1
        displayOrder:
          type: integer
          minimum: 0
        components:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/AdminOutfitComponentInput'

    AdminOutfitItemInput:
      type: object
      additionalProperties: false
      required: [id, productId, defaultColorVariantId, quantity, displayOrder]
      properties:
        id:
          type: string
          format: uuid
          description: Stable draft child identifier used by exact size mappings.
        productId:
          type: string
          format: uuid
        defaultColorVariantId:
          type: string
          format: uuid
        quantity:
          type: integer
          minimum: 1
          maximum: 20
        displayOrder:
          type: integer
          minimum: 0

    AdminOutfitInput:
      type: object
      additionalProperties: false
      required:
        - name
        - slug
        - description
        - categoryIds
        - mediaIds
        - featuredMediaId
        - items
        - sizes
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 180
        slug:
          type: string
          pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
          maxLength: 160
        description:
          type: string
          minLength: 1
          maxLength: 10000
        categoryIds:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            format: uuid
        mediaIds:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            format: uuid
        featuredMediaId:
          type: string
          format: uuid
        seo:
          $ref: '#/components/schemas/Seo'
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/AdminOutfitItemInput'
        sizes:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/AdminOutfitSizeInput'

