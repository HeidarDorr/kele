      required:
        - name
        - slug
        - description
        - categoryIds
        - mediaIds
        - featuredMediaId
        - items
        - sizes
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 180
        slug:
          type: string
          pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
          maxLength: 160
        description:
          type: string
          minLength: 1
          maxLength: 10000
        categoryIds:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            format: uuid
        mediaIds:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            format: uuid
        featuredMediaId:
          type: string
          format: uuid
        seo:
          $ref: '#/components/schemas/Seo'
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/AdminOutfitItemInput'
        sizes:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/AdminOutfitSizeInput'

    OutfitRevisionState:
      type: string
      enum: [draft, published, historical]

    AdminOutfit:
      allOf:
        - $ref: '#/components/schemas/AdminOutfitInput'
        - type: object
          additionalProperties: false
          required:
            - id
            - status
            - version
            - revisionId
            - revisionNumber
            - revisionState
            - publishedAt
          properties:
            id:
              type: string
              format: uuid
            status:
              $ref: '#/components/schemas/PublicationStatus'
            version:
              type: integer
              minimum: 1
            revisionId:
              type: string
              format: uuid
            revisionNumber:
              type: integer
              minimum: 1
            revisionState:
              $ref: '#/components/schemas/OutfitRevisionState'
            publishedAt:
              type: [string, 'null']
              format: date-time

    AdminOutfitPage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AdminOutfit'
        page:
          $ref: '#/components/schemas/CursorPage'

    OutfitRevisionSummary:
      type: object
      additionalProperties: false
      required: [id, revisionNumber, state, name, publishedAt, createdAt]
      properties:
        id:
          type: string
          format: uuid
        revisionNumber:
          type: integer
          minimum: 1
        state:
          $ref: '#/components/schemas/OutfitRevisionState'
        name:
          type: string
        publishedAt:
          type: [string, 'null']
          format: date-time
        createdAt:
          type: string
          format: date-time

    AdminOutfitPreview:
      type: object
      additionalProperties: false
      required: [preview, outfit]
      properties:
        preview:
          type: boolean
          const: true
        outfit:
          $ref: '#/components/schemas/OutfitDetail'

    AdminPriceInput:
      type: object
      additionalProperties: false
      required: [amountRial, reason]
      properties:
        amountRial:
          type: integer
          format: int64
          minimum: 1
        reason:
          type: string
          minLength: 3
          maxLength: 500

    PublicationValidationError:
      type: object
      additionalProperties: false
      required: [path, ruleId, message]
      properties:
        path:
          type: string
        ruleId:
          type: string
          pattern: '^(CAT|PUB|OTF|INV)-[0-9]{3}$'
        message:
          type: string

    PublicationValidation:
      type: object
      additionalProperties: false
      required: [valid, errors]
      properties:
        valid:
          type: boolean
        errors:
          type: array
          items:
            $ref: '#/components/schemas/PublicationValidationError'

    AdminProductPreview:
      type: object
      additionalProperties: false
      required: [preview, product]
      properties:
        preview:
          type: boolean
          const: true
        product:
          $ref: '#/components/schemas/ProductDetail'

    Homepage:
      type: object
      required: [version, sections]
      properties:
        version:
          type: integer
          minimum: 0
        sections:
          type: array
          items:
            type: object
            required: [id, type, enabled, order, content]
            properties:
              id:
                type: string
                format: uuid
              type:
                type: string
              enabled:
                type: boolean
              order:
                type: integer
                minimum: 0
              content:
                type: object
                additionalProperties: true

    Problem:
      type: object
      required: [type, title, status, code, correlationId]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        code:
          type: string
          pattern: '^[A-Z0-9_]+$'
        correlationId:
          type: string
        errors:
          type: array
          items:
            type: object
            required: [path, code, message]
            properties:
              path:
                type: string
              code:
                type: string
              message:
                type: string

security:
  - SessionCookie: []
