services:
  postgres:
    image: docker.arvancloud.ir/postgres:16-alpine
    environment:
      POSTGRES_USER: kele
      POSTGRES_PASSWORD: kele
      POSTGRES_DB: kele
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U kele -d kele']
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - ./.data/postgres:/var/lib/postgresql/data
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: kele-minio
      MINIO_ROOT_PASSWORD: kele-minio-secret
    ports:
      - '9000:9000'
      - '9001:9001'
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - ./.data/minio:/data
  minio-init:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "mc alias set local http://minio:9000 kele-minio kele-minio-secret && mc mb --ignore-existing local/kele-development"
