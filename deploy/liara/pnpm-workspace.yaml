packages:
  - .

# This lockfile is generated and reviewed in-repository before Liara receives
# the source archive. Tarball integrity hashes are still enforced; this only
# avoids re-querying registry metadata for every locked transitive dependency
# inside Liara's five-minute build window.
trustLockfile: true

overrides:
  brace-expansion: 5.0.9
  effect: 3.20.0
  esbuild: 0.28.1
  js-yaml: 4.3.1
  nanoid: 3.3.17
  postcss: 8.5.23
  sharp: 0.35.0

allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  prisma: true
  sharp: true
