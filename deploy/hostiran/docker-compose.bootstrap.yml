# Hostiran bootstrap without MinIO (Iranian networks often block quay.io).
# Usage: docker compose -f docker-compose.bootstrap.yml up -d --build

services:
  postgres:
    image: docker.arvancloud.ir/postgres:16-alpine
    environment:
      POSTGRES_USER: kele
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: kele
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U kele -d kele']
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

  kele:
    image: kele-hostiran:latest
    build:
      context: ../..
      dockerfile: Dockerfile.hostiran
      network: host
      args:
        VCS_REF: ${KELE_VCS_REF:-initial-hostiran}
        BUILD_DATE: ${KELE_BUILD_DATE:-unknown}
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - '3000'
    mem_limit: 1536m
    restart: unless-stopped

  caddy:
    image: docker.arvancloud.ir/caddy:2.8-alpine
    environment:
      KELE_DOMAIN: ${KELE_DOMAIN:?KELE_DOMAIN is required}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - kele
    restart: unless-stopped

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
