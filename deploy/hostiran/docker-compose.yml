services:
  postgres:
    image: docker.arvancloud.ir/postgres:16-alpine
    environment:
      POSTGRES_USER: kele
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: kele
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U kele -d kele']
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

  minio:
    build:
      context: .
      dockerfile: Dockerfile.minio
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY:?STORAGE_ACCESS_KEY is required}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_KEY:?STORAGE_SECRET_KEY is required}
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:9000/minio/health/live']
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - minio-data:/data
    restart: unless-stopped

  minio-init:
    build:
      context: .
      dockerfile: Dockerfile.minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY:?STORAGE_ACCESS_KEY is required}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_KEY:?STORAGE_SECRET_KEY is required}
      STORAGE_BUCKET: ${STORAGE_BUCKET:?STORAGE_BUCKET is required}
    entrypoint: ['/bin/sh', '-c']
    command:
      - >-
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" &&
        mc mb --ignore-existing "local/$$STORAGE_BUCKET"

  kele:
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        VCS_REF: ${KELE_VCS_REF:-initial-hostiran}
        BUILD_DATE: ${KELE_BUILD_DATE:-unknown}
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    expose:
      - '3000'
    mem_limit: 1536m
    restart: unless-stopped

  caddy:
    image: docker.arvancloud.ir/caddy:2.8-alpine
    environment:
      KELE_DOMAIN: ${KELE_DOMAIN:?KELE_DOMAIN is required}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - kele
    restart: unless-stopped

volumes:
  postgres-data:
  minio-data:
  caddy-data:
  caddy-config:

# Hostiran presents ens160 with MTU 1400. Docker's default 1500 makes
# containers advertise MSS 1460, and larger segments are dropped.
networks:
  default:
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: "1400"
